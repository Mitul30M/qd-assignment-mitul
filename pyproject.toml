[project]
name = "qd-assignment"
version = "0.1.0"
description = "QuickDrop Rider Payout Dispute Desk agent"
readme = "README.md"
authors = [
    { name = "Mitul M.", email = "mitulmungase123@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary,pool]>=3.1",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langchain-core>=1.7.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
extend-select = ["B", "SIM", "UP"]
ignore = ["BLE001", "SIM115"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["integration: hits the compose Postgres/PaySwift; skips without TEST_DATABASE_URL"]

[tool.uv]
package = false
