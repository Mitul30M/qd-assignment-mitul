# Starter file. Add your own services (your app, Postgres) next to payswift. Leave payswift as it is.
services:
  payswift:
    build: ./payswift
    ports:
      - "8081:8081"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qd
      POSTGRES_PASSWORD: qd
      POSTGRES_DB: qd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qd -d qd"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"          # host access for local test/integration debugging

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://qd:qd@postgres:5432/qd
      PAYSWIFT_BASE_URL: http://payswift:8081
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      payswift:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  pgdata:
